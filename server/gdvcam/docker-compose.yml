name: gdvcam

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdvcam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gdvcam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdvcam"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: gdvcam-api
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./debug-logs:/app/debug-logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - edge_default

volumes:
  pgdata:
    name: gdvcam_postgres_data

networks:
  edge_default:
    external: true
