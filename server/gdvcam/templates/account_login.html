<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · GDVCam</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header><a class="brand brand-link" href="/">GDVCam</a></header>
  <main class="narrow auth-page">
    <img class="logo small" src="/static/logo.png" alt="GDVCam" width="88" height="88">
    <p class="eyebrow">Conta GDnew</p>
    <h1>Entre na sua conta</h1>
    <p class="note">Seu saldo e suas compras ficam disponíveis em todos os acessos autorizados.</p>
    {% if error == "auth" %}<p class="flash error">Usuário, e-mail ou senha inválidos.</p>{% endif %}
    <form class="admin-login" method="post" action="/account/login">
      <label for="login">Usuário ou e-mail</label>
      <input id="login" name="login" autocomplete="username" required autofocus>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
    </form>
    <p class="note">Ainda não possui conta? <a href="/account/register">Cadastre-se</a></p>
  </main>
</body>
</html>
