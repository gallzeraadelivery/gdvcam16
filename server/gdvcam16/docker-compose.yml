name: gdvcam16

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdvcam16
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gdvcam16
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdvcam16"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    container_name: gdvcam16-web
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - default
      - proxy

volumes:
  data:
    name: gdvcam16_data

networks:
  proxy:
    external: true
    name: gdnew_web

